name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q --cov=inspire_mcp --cov-report=term-missing --cov-fail-under=80

  docker:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        extras: ["", "semantic"]
    steps:
      - uses: actions/checkout@v7
      - run: docker build --build-arg EXTRAS=${{ matrix.extras }} -t inspire-mcp:ci .
      - name: smoke test /healthz
        run: |
          docker run -d --name mcp -p 8000:8000 inspire-mcp:ci
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8000/healthz && exit 0; sleep 1; done
          docker logs mcp; exit 1

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker run --rm -v "$PWD/deploy/k8s:/k8s" ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary /k8s
