# Optional: a local semantic index for semantic_search (half of its candidates then come from it).
# 1. apply this file: the Job builds the index once (several hours on CPU), the CronJob adds new records
#    every month; 2. in deployment.yaml, uncomment the INSPIRE_MCP_DENSE_INDEX lines and raise the memory
#    limit (the index needs about 1.3 GB, twice that while a running server reloads an updated index).
# The volume is written by the jobs and read by every server replica: it needs a storage class with
# ReadWriteMany access. Servers reload the index on their own after an update (checked every 10 minutes).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: inspire-mcp-index
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests: {storage: 2Gi}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: inspire-mcp-index-build
spec:
  backoffLimit: 2
  template:
    metadata:
      labels: {app: inspire-mcp-index}
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: build
          image: ghcr.io/jacopotorasso/inspire-mcp:latest-semantic
          command: ["/app/.venv/bin/inspire-mcp", "index", "build", "/index"]
          resources:
            requests: {cpu: "2", memory: 2Gi}
            limits: {cpu: "4", memory: 3Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: index, mountPath: /index}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: index
          persistentVolumeClaim: {claimName: inspire-mcp-index}
        - name: tmp
          emptyDir: {}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: inspire-mcp-index-update
spec:
  schedule: "0 3 1 * *"          # monthly; papers newer than the index still come from INSPIRE's live search
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels: {app: inspire-mcp-index}
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            fsGroup: 10001
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: update
              image: ghcr.io/jacopotorasso/inspire-mcp:latest-semantic
              command: ["/app/.venv/bin/inspire-mcp", "index", "update", "/index"]
              resources:
                requests: {cpu: "1", memory: 2Gi}
                limits: {cpu: "2", memory: 3Gi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: index, mountPath: /index}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: index
              persistentVolumeClaim: {claimName: inspire-mcp-index}
            - name: tmp
              emptyDir: {}
