apiVersion: apps/v1
kind: Deployment
metadata:
  name: inspire-mcp
  labels: {app: inspire-mcp}
spec:
  replicas: 2
  selector:
    matchLabels: {app: inspire-mcp}
  template:
    metadata:
      labels: {app: inspire-mcp}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: inspire-mcp
          image: ghcr.io/jacopotorasso/inspire-mcp:latest-semantic
          ports:
            - {name: http, containerPort: 8000}
          env:
            - {name: INSPIRE_MCP_CACHE, value: /cache}
            - {name: INSPIRE_MCP_LOG_FORMAT, value: json}
            - {name: INSPIRE_MCP_ALLOWED_HOSTS, value: inspire-mcp.example.org}   # your public host name
            - {name: INSPIRE_MCP_TRUST_PROXY, value: "true"}                     # behind the ingress
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 1Gi}
          readinessProbe:            # 503 until the reranker model is loaded
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          startupProbe:
            httpGet: {path: /healthz, port: http}
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: cache, mountPath: /cache}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: cache
          emptyDir: {sizeLimit: 1Gi}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: inspire-mcp
spec:
  selector: {app: inspire-mcp}
  ports:
    - {name: http, port: 80, targetPort: http}
