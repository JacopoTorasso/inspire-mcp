[project]
name = "inspire-mcp"
version = "0.2.0"
description = "MCP server exposing the INSPIRE-HEP literature and author APIs to AI assistants, with a retrieval evaluation harness"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Jacopo Torasso" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "mcp>=1.2",
]

[project.optional-dependencies]
semantic = [
    "fastembed>=0.9.1",
    "numpy>=2.5.5",
]
eval = [
    "fastembed>=0.9.1",
    "numpy>=2.5.5",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "numpy>=2.5.5",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.6",
]

[project.scripts]
inspire-mcp = "inspire_mcp.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
