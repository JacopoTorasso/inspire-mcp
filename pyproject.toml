[project]
name = "inspire-mcp"
version = "0.5.3"
description = "Ask AI assistants about high energy physics literature in plain language: an MCP server for INSPIRE-HEP with measured semantic search"
readme = "README.md"
license = "MIT"
keywords = ["mcp", "model-context-protocol", "inspire-hep", "high-energy-physics", "semantic-search", "rag", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
authors = [
    { name = "Jacopo Torasso" }
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "mcp>=2.3,<3",
    "starlette>=0.46",
]

[project.optional-dependencies]
semantic = [
    "fastembed>=0.9.1",
    "numpy>=1.26",
]
eval = [
    "fastembed>=0.9.1",
    "numpy>=1.26",
    "anthropic>=1.0",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "numpy>=1.26",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.6",
]

[project.urls]
Repository = "https://github.com/JacopoTorasso/inspire-mcp"
Issues = "https://github.com/JacopoTorasso/inspire-mcp/issues"
Changelog = "https://github.com/JacopoTorasso/inspire-mcp/blob/main/CHANGELOG.md"

[project.scripts]
inspire-mcp = "inspire_mcp.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
files = ["src"]
